name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,evaluation]'
      - run: python -m pytest
      - run: mypy adaptkit examples benchmarks tests
      - run: pyright adaptkit examples benchmarks
      - name: Guarded build, Twine, and clean install checks
        run: python scripts/release_build.py --check
