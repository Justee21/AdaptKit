[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptkit"
version = "0.1.0"
description = "Contextual-bandit personalization from explicit and implicit agent feedback"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AdaptKit contributors"}]
keywords = ["agents", "personalization", "thompson-sampling", "contextual-bandit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Justee21/AdaptKit"
Repository = "https://github.com/Justee21/AdaptKit"
Issues = "https://github.com/Justee21/AdaptKit/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pyright>=1.1.390",
  "pytest>=8",
  "twine>=5",
]
evaluation = [
  "openai>=3.13,<4",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["adaptkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
