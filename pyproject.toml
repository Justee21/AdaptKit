[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptkit"
version = "0.1.0"
description = "Provider-independent per-user agent behavior personalization with contextual bandits"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AdaptKit contributors"}]
keywords = ["agents", "personalization", "thompson-sampling", "contextual-bandit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Justee21/AdaptKit"
Repository = "https://github.com/Justee21/AdaptKit"
Issues = "https://github.com/Justee21/AdaptKit/issues"
Changelog = "https://github.com/Justee21/AdaptKit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Justee21/AdaptKit#readme"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pyright>=1.1.390,<2",
  "pytest>=8,<9",
  "twine>=5,<7",
]
evaluation = [
  "openai>=3.13,<4",
  "pydantic>=2.0,<3",
  "python-dotenv>=1.0,<2",
]
memory-mem0 = ["mem0ai>=2.0,<3"]
memory-letta = ["letta-client>=1.12,<2"]

[tool.setuptools.packages.find]
include = ["adaptkit*"]

[tool.setuptools.package-data]
adaptkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
