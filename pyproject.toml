[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptkit"
version = "0.1.0"
description = "Contextual-bandit personalization from explicit and implicit agent feedback"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AdaptKit contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["adaptkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
